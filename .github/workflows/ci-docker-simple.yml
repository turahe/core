name: CI with Docker (Simple)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  docker-tests:
    name: Docker Tests (PHP 8.4 - Laravel 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker services
        run: |
          docker-compose up -d mysql redis
          docker-compose logs mysql redis

      - name: Wait for services to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          timeout 60 bash -c 'until docker-compose exec -T mysql mysqladmin ping -h"localhost" --silent; do sleep 2; done'
          
          echo "Waiting for Redis to be ready..."
          timeout 60 bash -c 'until docker-compose exec -T redis redis-cli ping; do sleep 2; done'

      - name: Create test database
        run: |
          docker-compose exec -T mysql mysql -u turahe -pturahe123 -e "CREATE DATABASE IF NOT EXISTS turahe_core_testing;"

      - name: Build test container
        run: |
          docker build -f docker/test/Dockerfile \
            --build-arg PHP_VERSION=8.4 \
            --build-arg LARAVEL_VERSION=10.* \
            --build-arg TESTBENCH_VERSION=8.* \
            -t turahe-core-test .

      - name: Run tests in Docker container
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: turahe_core_testing
          DB_USERNAME: turahe
          DB_PASSWORD: turahe123
          DB_CONNECTION: mysql
          CORE_TABLE_USE_TIMESTAMPS: false
          USERSTAMPS_USERS_TABLE_COLUMN_TYPE: ulid
          APP_KEY: base64:MFOsOH9RomiI2LRdgP4hIeoQJ5nyBhdABdH77UY2zi8=
          CORE_TABLE_SETTINGS: settings
          CORE_TABLE_ORGANIZATIONS: organizations
          CORE_TABLE_MODEL_HAS_ORGANIZATION: model_has_organization
          CORE_TABLE_TAXONOMIES: taxonomies
          CORE_TABLE_MODEL_HAS_TAXONOMIES: model_has_taxonomies
          CORE_TABLE_TAGS: tags
          CORE_TABLE_TAGGABLES: taggables
          CORE_TABLE_OAUTH_ACCOUNTS: oauth_accounts
          CORE_CACHE_ENABLED: true
          CORE_CACHE_SETTINGS_TTL: 3600
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 1
          REDIS_PASSWORD: null
        run: |
          docker run --rm \
            --network host \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_DATABASE \
            -e DB_USERNAME \
            -e DB_PASSWORD \
            -e DB_CONNECTION \
            -e CORE_TABLE_USE_TIMESTAMPS \
            -e USERSTAMPS_USERS_TABLE_COLUMN_TYPE \
            -e APP_KEY \
            -e CORE_TABLE_SETTINGS \
            -e CORE_TABLE_ORGANIZATIONS \
            -e CORE_TABLE_MODEL_HAS_ORGANIZATION \
            -e CORE_TABLE_TAXONOMIES \
            -e CORE_TABLE_MODEL_HAS_TAXONOMIES \
            -e CORE_TABLE_TAGS \
            -e CORE_TABLE_TAGGABLES \
            -e CORE_TABLE_OAUTH_ACCOUNTS \
            -e CORE_CACHE_ENABLED \
            -e CORE_CACHE_SETTINGS_TTL \
            -e REDIS_HOST \
            -e REDIS_PORT \
            -e REDIS_DB \
            -e REDIS_PASSWORD \
            turahe-core-test \
            vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: docker-tests
          name: codecov-docker
          fail_ci_if_error: false

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker-compose down -v
          docker system prune -f

  docker-code-quality:
    name: Docker Code Quality
    runs-on: ubuntu-latest
    needs: docker-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build code quality container
        run: |
          docker build -f docker/test/Dockerfile \
            --build-arg PHP_VERSION=8.4 \
            --build-arg LARAVEL_VERSION=10.* \
            --build-arg TESTBENCH_VERSION=8.* \
            -t turahe-core-code-quality .

      - name: Run PHP CS Fixer
        run: |
          docker run --rm turahe-core-code-quality \
            vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan
        run: |
          docker run --rm turahe-core-code-quality \
            vendor/bin/phpstan analyse --level=8 src/

      - name: Run Psalm
        run: |
          docker run --rm turahe-core-code-quality \
            vendor/bin/psalm --no-progress

      - name: Check code style with Laravel Pint
        run: |
          docker run --rm turahe-core-code-quality \
            vendor/bin/pint --test

  docker-package-test:
    name: Docker Package Installation Test
    runs-on: ubuntu-latest
    needs: docker-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build package test container
        run: |
          docker build -f docker/test/Dockerfile \
            --build-arg PHP_VERSION=8.4 \
            --build-arg LARAVEL_VERSION=10.* \
            --build-arg TESTBENCH_VERSION=8.* \
            -t turahe-core-package-test .

      - name: Test package installation
        run: |
          docker run --rm turahe-core-package-test \
            bash -c "
              composer create-project laravel/laravel test-project --prefer-dist --no-interaction &&
              cd test-project &&
              composer require turahe/core:dev-main --prefer-source --no-interaction &&
              php artisan vendor:publish --provider='Turahe\Core\CoreServiceProvider' &&
              php artisan migrate --force &&
              php artisan tinker --execute=\"echo 'Package loaded successfully';\" &&
              php artisan tinker --execute=\"echo 'Helper functions available: ' . (function_exists('format_currency') ? 'Yes' : 'No');\"
            "

  docker-test-summary:
    name: Docker Test Summary
    runs-on: ubuntu-latest
    needs: [docker-tests, docker-code-quality, docker-package-test]
    if: always()

    steps:
      - name: Docker Test Summary
        run: |
          echo "## Docker Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Tests | ${{ needs.docker-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Code Quality | ${{ needs.docker-code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Package Test | ${{ needs.docker-package-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Environment:** MySQL + Redis" >> $GITHUB_STEP_SUMMARY
          echo "**PHP Version:** 8.4" >> $GITHUB_STEP_SUMMARY
          echo "**Laravel Version:** 10.*" >> $GITHUB_STEP_SUMMARY
          echo "**Testbench Version:** 8.*" >> $GITHUB_STEP_SUMMARY 