name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  tests:
    name: Tests (PHP 8.4 - Laravel 12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json, pdo_sqlite
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:12.*" "orchestra/testbench:9.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Setup test environment
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests (Unit and Feature)
        run: vendor/bin/phpunit --coverage-clover=coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/clover.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-tests:
    name: Docker Tests (PHP 8.4 - Laravel 12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker services
        run: |
          docker-compose up -d mysql redis
          docker-compose logs mysql redis

      - name: Wait for services to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          timeout 60 bash -c 'until docker-compose exec -T mysql mysqladmin ping -h"localhost" --silent; do sleep 2; done'
          
          echo "Waiting for Redis to be ready..."
          timeout 60 bash -c 'until docker-compose exec -T redis redis-cli ping; do sleep 2; done'

      - name: Create test database
        run: |
          docker-compose exec -T mysql mysql -u turahe -pturahe123 -e "CREATE DATABASE IF NOT EXISTS turahe_core_testing;"

      - name: Build test container
        run: |
          docker build -f docker/test/Dockerfile \
            --build-arg PHP_VERSION=8.4 \
            --build-arg LARAVEL_VERSION=12.* \
            --build-arg TESTBENCH_VERSION=9.* \
            -t turahe-core-test .

      - name: Run tests in Docker container
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: turahe_core_testing
          DB_USERNAME: turahe
          DB_PASSWORD: turahe123
          DB_CONNECTION: mysql
          CORE_TABLE_USE_TIMESTAMPS: false
          USERSTAMPS_USERS_TABLE_COLUMN_TYPE: ulid
          APP_KEY: base64:MFOsOH9RomiI2LRdgP4hIeoQJ5nyBhdABdH77UY2zi8=
          CORE_TABLE_SETTINGS: settings
          CORE_TABLE_ORGANIZATIONS: organizations
          CORE_TABLE_MODEL_HAS_ORGANIZATION: model_has_organization
          CORE_TABLE_TAXONOMIES: taxonomies
          CORE_TABLE_MODEL_HAS_TAXONOMIES: model_has_taxonomies
          CORE_TABLE_TAGS: tags
          CORE_TABLE_TAGGABLES: taggables
          CORE_TABLE_OAUTH_ACCOUNTS: oauth_accounts
          CORE_CACHE_ENABLED: true
          CORE_CACHE_SETTINGS_TTL: 3600
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 1
          REDIS_PASSWORD: null
        run: |
          docker run --rm \
            --network host \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_DATABASE \
            -e DB_USERNAME \
            -e DB_PASSWORD \
            -e DB_CONNECTION \
            -e CORE_TABLE_USE_TIMESTAMPS \
            -e USERSTAMPS_USERS_TABLE_COLUMN_TYPE \
            -e APP_KEY \
            -e CORE_TABLE_SETTINGS \
            -e CORE_TABLE_ORGANIZATIONS \
            -e CORE_TABLE_MODEL_HAS_ORGANIZATION \
            -e CORE_TABLE_TAXONOMIES \
            -e CORE_TABLE_MODEL_HAS_TAXONOMIES \
            -e CORE_TABLE_TAGS \
            -e CORE_TABLE_TAGGABLES \
            -e CORE_TABLE_OAUTH_ACCOUNTS \
            -e CORE_CACHE_ENABLED \
            -e CORE_CACHE_SETTINGS_TTL \
            -e REDIS_HOST \
            -e REDIS_PORT \
            -e REDIS_DB \
            -e REDIS_PASSWORD \
            turahe-core-test \
            vendor/bin/phpunit --coverage-clover=coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/clover.xml
          flags: docker-tests
          name: codecov-docker
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker-compose down -v
          docker system prune -f

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [tests, docker-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --level=8 src/

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

      - name: Check code style with Laravel Pint
        run: vendor/bin/pint --test

  security:
    name: Security Check
    runs-on: ubuntu-latest
    needs: [tests, docker-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Security Check
        run: vendor/bin/security-checker security:check composer.lock

      - name: Run PHP Security Checker
        run: vendor/bin/phpcs --standard=Security /dev/null || true

  package-test:
    name: Package Installation Test
    runs-on: ubuntu-latest
    needs: [tests, docker-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Create test Laravel project
        run: |
          composer create-project laravel/laravel test-project --prefer-dist --no-interaction
          cd test-project

      - name: Install package in test project
        run: |
          cd test-project
          composer require turahe/core:dev-master --prefer-source --no-interaction

      - name: Publish package assets
        run: |
          cd test-project
          php artisan vendor:publish --provider="Turahe\Core\CoreServiceProvider"

      - name: Run package migrations
        run: |
          cd test-project
          php artisan migrate --force

      - name: Test package integration
        run: |
          cd test-project
          php artisan tinker --execute="echo 'Package loaded successfully';"
          php artisan tinker --execute="echo 'Helper functions available: ' . (function_exists('format_currency') ? 'Yes' : 'No');"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [tests, docker-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Lint PHP files
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check composer.json
        run: composer validate --strict

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    needs: [tests, docker-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json, pdo_sqlite
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Setup test environment
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Generate coverage report
        run: vendor/bin/phpunit --coverage-html coverage/html --coverage-text

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [tests, docker-tests, code-quality, security, package-test, lint]
    if: always()

    steps:
      - name: CI Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Tests | ${{ needs.docker-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package Test | ${{ needs.package-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Ubuntu Latest" >> $GITHUB_STEP_SUMMARY
          echo "**PHP Version:** 8.4" >> $GITHUB_STEP_SUMMARY
          echo "**Laravel Version:** 12.*" >> $GITHUB_STEP_SUMMARY
          echo "**Testbench Version:** 9.*" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Services:** MySQL + Redis" >> $GITHUB_STEP_SUMMARY