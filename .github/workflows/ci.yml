name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [8.*, 9.*, 10.*]
        dependency-version: [prefer-stable]
        include:
          - php: 8.2
            laravel: 8.*
            testbench: 6.*
          - php: 8.2
            laravel: 9.*
            testbench: 7.*
          - php: 8.2
            laravel: 10.*
            testbench: 8.*
          - php: 8.3
            laravel: 9.*
            testbench: 7.*
          - php: 8.3
            laravel: 10.*
            testbench: 8.*
          - php: 8.4
            laravel: 10.*
            testbench: 8.*
        exclude:
          - php: 8.3
            laravel: 8.*
          - php: 8.4
            laravel: 8.*
          - php: 8.4
            laravel: 9.*

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, iconv, mbstring, xml, ctype, json, pdo_sqlite
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Setup test environment
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests (Unit and Feature)
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --level=8 src/

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

      - name: Check code style with Laravel Pint
        run: vendor/bin/pint --test

  security:
    name: Security Check
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Security Check
        run: vendor/bin/security-checker security:check composer.lock

      - name: Run PHP Security Checker
        run: vendor/bin/phpcs --standard=Security /dev/null || true

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json, pdo_sqlite
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Setup test environment
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Generate coverage report
        run: vendor/bin/phpunit --coverage-html coverage-report --coverage-text

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage-report/

  package-test:
    name: Package Installation Test
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Create test Laravel project
        run: |
          composer create-project laravel/laravel test-project --prefer-dist --no-interaction
          cd test-project

      - name: Install package in test project
        run: |
          composer require turahe/core:dev-main --prefer-source --no-interaction

      - name: Publish package assets
        run: php artisan vendor:publish --provider="Turahe\Core\CoreServiceProvider"

      - name: Run package migrations
        run: php artisan migrate --force

      - name: Test package integration
        run: |
          php artisan tinker --execute="echo 'Package loaded successfully';"
          php artisan tinker --execute="echo 'Helper functions available: ' . (function_exists('format_currency') ? 'Yes' : 'No');"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Lint PHP files
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check composer.json
        run: composer validate --strict

  test-matrix:
    name: Test Matrix Summary
    runs-on: ubuntu-latest
    needs: [tests, code-quality, security, package-test, lint]
    if: always()

    steps:
      - name: Test Matrix Summary
        run: |
          echo "## Test Matrix Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package Test | ${{ needs.package-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Tests:** 196" >> $GITHUB_STEP_SUMMARY
          echo "**Total Assertions:** 418" >> $GITHUB_STEP_SUMMARY 