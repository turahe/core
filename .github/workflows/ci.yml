name: CI

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

jobs:
  test:
    name: Tests (PHP 8.4 - Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "12"
            testbench: "10.0"
          - laravel: "13"
            testbench: "11.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies --with="laravel/framework:^${{ matrix.laravel }}.0" --with="orchestra/testbench:^${{ matrix.testbench }}"

      - name: Execute tests
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: sqlite-tests
          name: codecov-laravel-${{ matrix.laravel }}
          fail_ci_if_error: false

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Test Summary
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** PHP 8.4 + Laravel 12 and Laravel 13" >> $GITHUB_STEP_SUMMARY
          echo "**Database:** SQLite in-memory" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** Enabled with Codecov" >> $GITHUB_STEP_SUMMARY
