name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Setup test environment
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests
        run: vendor/bin/phpunit

      - name: Validate package
        run: |
          composer validate --strict
          vendor/bin/pint --test

  build:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Generate changelog
        run: |
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 🚀 Features" >> CHANGELOG.md
          echo "- Comprehensive test coverage" >> CHANGELOG.md
          echo "- Image processing with ImgProxy integration" >> CHANGELOG.md
          echo "- OAuth integration for Google and Microsoft" >> CHANGELOG.md
          echo "- Taxonomy and tagging system" >> CHANGELOG.md
          echo "- Organization management" >> CHANGELOG.md
          echo "- Email processing capabilities" >> CHANGELOG.md
          echo "- Utility helper functions" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 🧪 Testing" >> CHANGELOG.md
          echo "- Full test coverage of all components" >> CHANGELOG.md
          echo "- PHP 8.4 + Laravel 12 support" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📦 Installation" >> CHANGELOG.md
          echo "```bash" >> CHANGELOG.md
          echo "composer require turahe/core" >> CHANGELOG.md
          echo "```" >> CHANGELOG.md

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./CHANGELOG.md
          asset_name: CHANGELOG.md
          asset_content_type: text/markdown 