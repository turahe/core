name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, iconv, mbstring, xml, ctype, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Setup test environment
        run: |
          # SQLite in-memory database - no file needed
          echo "Test environment ready for SQLite in-memory"

      - name: Execute tests
        run: vendor/bin/phpunit

 