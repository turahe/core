
services:
  mysql:
    image: mysql:8.0
    container_name: turahe-core-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: turahe_core
      MYSQL_USER: turahe
      MYSQL_PASSWORD: turahe123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - turahe-network
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: turahe-core-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - turahe-network

  redis:
    image: redis:7-alpine
    container_name: turahe-core-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - turahe-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: turahe-core-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - turahe-network

  app:
    build:
      context: .
      dockerfile: docker/test/Dockerfile
    container_name: turahe-core-app
    volumes:
      - .:/app
      - /app/vendor
    environment:
      - APP_ENV=testing
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=turahe_core_testing
      - DB_USERNAME=turahe
      - DB_PASSWORD=turahe123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=1
    depends_on:
      - mysql
      - redis
    networks:
      - turahe-network
    command: >
      sh -c "
        echo 'Waiting for MySQL...' &&
        while ! nc -z mysql 3306; do sleep 1; done &&
        echo 'Waiting for Redis...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Running tests...' &&
        php vendor/bin/phpunit
      "

  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: turahe-core-imgproxy
    ports:
      - "8080:8080"
    environment:
      IMGPROXY_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      IMGPROXY_SALT: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      IMGPROXY_SIGNATURE_SIZE: 32
    restart: unless-stopped
    networks:
      - turahe-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  turahe-network:
    driver: bridge 